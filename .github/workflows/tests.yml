name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit-tests:
    name: "Unit tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install SuiteSparse headers (scikit-sparse, needed by enterprise)
        run: sudo apt-get update && sudo apt-get install -y libsuitesparse-dev

      - name: Install asimov-ptadata with test, asimov and noise extras
        run: |
          python -m pip install --upgrade pip
          # noise: enterprise + PTMCMCSampler, so the real-PTA tests run
          # rather than skip.
          pip install -e ".[asimov,noise,test]"

      - name: Run pytest
        run: pytest
