#;
#; This file is generated by asimov's generic `asimov manage build` step
#; (Analysis.make_config(), via this Liquid template) so that step has
#; somewhere to write to - but it is not what NoisePipeline actually reads.
#; The real per-subject settings file (par/tim paths for each
#; review-approved reduce production) is written directly by
#; NoisePipeline.build_dag(), because resolving those assets requires
#; calling collect_assets() on each dependency's pipeline - not something
#; this template's Liquid rendering can do.
pipeline: {{ pipeline.name }}
