#; ptadata-gwb configuration file created by asimov for a project
#; analysis. Subjects:
{%- for subject in analysis.subjects %}
#;   - {{ subject.name }}
{%- endfor %}
#;
#; This file is generated by asimov's generic `asimov manage build` step
#; (Analysis.make_config(), via this Liquid template) so that step has
#; somewhere to write to - but it is not what GWBPipeline actually reads.
#; The real joint settings file (one shared PTA across every subject, with
#; each pulsar's par/tim paths and Phase-1 fixed noise values) is written
#; directly by GWBPipeline.build_dag(), because resolving those requires
#; walking the ledger's project analyses and calling collect_assets() on
#; each review-approved ptadata-noise dependency - not something this
#; template's Liquid rendering can do.
pipeline: {{ pipeline.name }}
